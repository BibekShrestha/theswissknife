<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="The Swiss Knife — sharp little developer tools that run entirely in your browser: jq playground, JWT decoder, and more." />
    <link rel="canonical" href="https://theswissknife.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Swiss Knife" />
    <meta property="og:description" content="Dedicated, no-nonsense developer tools. 100% client-side — nothing you paste ever leaves your machine." />
    <meta property="og:url" content="https://theswissknife.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23da291c'/%3E%3Cpath d='M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('tsk.theme') || localStorage.getItem('jqplay.theme')
          const theme = saved === 'dark' || saved === 'light'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#11110f' : '#f4f1ea'
        } catch {}
      })()
    </script>
    <title>The Swiss Knife</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
